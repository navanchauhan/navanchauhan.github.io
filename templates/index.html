{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block body %}

<main>
	{{ content}}

<h1>Recent Posts</h1>
<ul>
{% for post in posts[:20] %}
	<li><a href="{{post.link}}">{{ post.title }}</a> - {{ post.date | pretty_date | safe }}</li>
{% endfor %}
</ul>

<b>For all posts go to <a href="/posts">Posts</a></b>

</main>
{% endblock %}
