<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Browser-use transport route</title>
  <desc id="desc">A request travels from an SDK, CLI, or MCP server through a local socket, Go native host, Chrome Native Messaging, an MV3 service worker, and Chrome APIs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1a5b74"/></marker>
  </defs>
  <rect width="1200" height="260" rx="12" fill="#fbf8f2"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#e5f0f3" stroke="#1a5b74" stroke-width="2">
      <rect x="20" y="55" width="150" height="120" rx="8"/>
      <rect x="220" y="55" width="150" height="120" rx="8"/>
      <rect x="420" y="55" width="150" height="120" rx="8"/>
      <rect x="620" y="55" width="150" height="120" rx="8"/>
      <rect x="820" y="55" width="150" height="120" rx="8"/>
      <rect x="1020" y="55" width="150" height="120" rx="8"/>
    </g>
    <g fill="none" stroke="#1a5b74" stroke-width="3" marker-end="url(#arrow)">
      <path d="M175 115h35"/><path d="M375 115h35"/><path d="M575 115h35"/><path d="M775 115h35"/><path d="M975 115h35"/>
    </g>
    <g fill="#263238">
      <text x="95" y="98" font-size="16" font-weight="bold"><tspan x="95">SDK / CLI / MCP</tspan></text>
      <text x="95" y="128" font-size="14">JSON-RPC request</text>
      <text x="295" y="98" font-size="16" font-weight="bold">Local socket</text>
      <text x="295" y="128" font-size="14">Unix socket</text>
      <text x="495" y="98" font-size="16" font-weight="bold">Go native host</text>
      <text x="495" y="128" font-size="14">length + JSON</text>
      <text x="695" y="98" font-size="16" font-weight="bold">Native Messaging</text>
      <text x="695" y="128" font-size="14">stdin / stdout</text>
      <text x="895" y="98" font-size="16" font-weight="bold">MV3 worker</text>
      <text x="895" y="128" font-size="14">dispatch + state</text>
      <text x="1095" y="98" font-size="16" font-weight="bold">Chrome APIs</text>
      <text x="1095" y="128" font-size="14">tabs · debugger</text>
    </g>
  </g>
  <text x="600" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#52636a">The extension turns one local request into actions on the real Chrome profile.</text>
</svg>
