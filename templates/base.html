<!DOCTYPE html>
<html lang="en">
<head>
    {% block head %}
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2e5a72">
    <meta name="theme-color" content="#2e5a72" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#2e5a72" media="(prefers-color-scheme: dark)">

    <title>{% block title %}{% endblock %}</title>

    <!--
    <link rel="stylesheet" href="https://unpkg.com/latex.css/style.min.css" />
    -->

    <link rel="stylesheet" href="/assets/c-hyde.css?v={{ asset_version }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Abril+Fatface">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=PT+Sans:400,400italic,700">

    <link rel="stylesheet" href="/assets/main.css?v={{ asset_version }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="{% block author %}Navan Chauhan{% endblock %}">
    <meta property="og:site_name" content="Navan Chauhan">
    <meta property="og:type" content="{% block ogtype %}website{% endblock %}">
    <meta property="og:logo" content="https://web.navan.dev/images/logo.png">
    <link rel="canonical" href="https://web.navan.dev{% block canURL %}{% endblock %}">
    <meta name="twitter:url" content="https://web.navan.dev{% block twURL %}{% endblock %}">
    <meta property="og:url" content="https://web.navan.dev{% block ogURL %}{% endblock %}">
    <meta name="twitter:title" content="{% block twittertitle %}Hey - Home{% endblock %}">
    <meta property="og:title" content="{% block ogtitle %}Hey - Home{% endblock %}">
    <meta name="description" content="{% block description %}code snippets, long-form rants, and tutorials{% endblock %}">
    <meta name="twitter:description" content="{% block twitterdescription %}code snippets, long-form rants, and tutorials{% endblock %}">
    <meta property="og:description" content="{% block ogdescription %}code snippets, long-form rants, and tutorials{% endblock %}">
    <meta name="twitter:card" content="{% block twitter2description %}summary_large_image{% endblock %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/images/favicon.png" type="image/png">
    <link href="/feed.rss" type="application/atom+xml" rel="alternate" title="Sitewide Atom feed">
    <meta name="twitter:image" content="{% block twimage %}https://web.navan.dev/images/logo.png{% endblock %}">
    <meta property="og:image" content="{% block ogimage %}https://web.navan.dev/images/logo.png{% endblock %}">
    <meta name="google-site-verification" content="LVeSZxz-QskhbEjHxOi7-BM5dDxTg53x2TwrjFxfL0k">
    <script async src="https://plausible.io/js/pa-SuXL31qHE4j-Qw_x3V_KR.js"></script>
    <script>
    window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
    plausible.init()
    </script>

    <link rel="manifest" href="/manifest.json?v={{ asset_version }}">
    {% endblock %}
</head>
<body class="theme-base-0d{% block body_class %}{% endblock %}">
    <div class="paint">
    {% include "sidebar.html" %}
    <div class="content container">
    {% block body %}{% endblock %}
    </div>
    </div>
    <script
        defer
        src="/pwabuilder-sw-register.js?v={{ asset_version }}"
        data-sw-version="{{ asset_version }}"
    ></script>
</body>
</html>
