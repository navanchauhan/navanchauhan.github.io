<script>
let phrases = [
    "Something Funny", "Veni, vidi, vici", "Alea iacta est", "In vino veritas", "Acta, non verba", "Castigat ridendo mores",
    "Cui bono?", "Memento vivere", "अहम् ब्रह्मास्मि", "अनुगच्छतु प्रवाहं", "चरन्मार्गान्विजानाति", "coq de cheval", "我愛啤酒"
    ];

// Translations, shown as a gloss under the phrase on hover.
let glosses = {
    "Veni, vidi, vici": "I came, I saw, I conquered",
    "Alea iacta est": "The die is cast",
    "In vino veritas": "In wine, truth",
    "Acta, non verba": "Deeds, not words",
    "Castigat ridendo mores": "Laughter corrects morals",
    "Cui bono?": "Who benefits?",
    "Memento vivere": "Remember to live",
    "अहम् ब्रह्मास्मि": "I am Brahman",
    "अनुगच्छतु प्रवाहं": "Go with the flow",
    "चरन्मार्गान्विजानाति": "The one who walks finds the paths",
    "我愛啤酒": "I love beer"
};

let lead = document.getElementById("random-lead");
let currentPhrase = null;

function pickPhrase() {
    let next = currentPhrase;
    while (phrases.length > 1 && next === currentPhrase) {
        next = phrases[Math.floor(Math.random()*phrases.length)];
    }
    return next;
}

function showPhrase() {
    currentPhrase = pickPhrase();
    lead.innerText = currentPhrase;
    if (glosses[currentPhrase]) { lead.dataset.gloss = glosses[currentPhrase]; } else { delete lead.dataset.gloss; }
}

showPhrase();

function cyclePhrase() {
    lead.classList.add("is-swapping");
    setTimeout(function() {
        showPhrase();
        lead.classList.remove("is-swapping");
    }, 180);
}

lead.addEventListener("click", cyclePhrase);
lead.addEventListener("keydown", function(e) {
    if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        cyclePhrase();
    }
});
