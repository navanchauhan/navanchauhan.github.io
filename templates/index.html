{% from "macros.html" import entry %}
{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block body %}

<main>
	{{ content}}

<h1>Recent Posts</h1>
<ol class="entry-list">
{% for post in posts[:20] %}
	{{ entry(post, with_year=True) }}
{% endfor %}
</ol>

<p class="entry-more"><a href="/posts/">All posts <span aria-hidden="true">&rarr;</span></a></p>

</main>
{% endblock %}
