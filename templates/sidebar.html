<script>
let phrases = [
    "Something Funny", "Veni, vidi, vici", "Alea iacta est", "In vino veritas", "Acta, non verba", "Castigat ridendo mores",
    "Cui bono?", "Memento vivere", "अहम् ब्रह्मास्मि", "अनुगच्छतु प्रवाहं", "चरन्मार्गान्विजानाति", "coq de cheval", "我愛啤酒", "Λαμψάτω τὸ φῶς ὑμῶν"
    ];

let lead = document.getElementById("random-lead");

function pickPhrase(current) {
    let next = current;
    while (phrases.length > 1 && next === current) {
        next = phrases[Math.floor(Math.random()*phrases.length)];
    }
    return next;
}

lead.innerText = pickPhrase(lead.innerText);

function cyclePhrase() {
    lead.classList.add("is-swapping");
    setTimeout(function() {
        lead.innerText = pickPhrase(lead.innerText);
        lead.classList.remove("is-swapping");
    }, 180);
}

lead.addEventListener("click", cyclePhrase);
lead.addEventListener("keydown", function(e) {
    if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        cyclePhrase();
    }
});

console.log("%c❦ salve, amice", "font-size: 1.3em; font-family: Georgia, serif;");
console.log("Poking around? The colophon explains how this site is put together: https://web.navan.dev/colophon/");
</script>
